[project]
name = "knowledge-assistant-backend"
version = "0.1.0"
description = "Enterprise AI Knowledge Assistant API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "asyncpg>=0.30",
  "redis>=5.2",
  "httpx>=0.27",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "sqlalchemy[asyncio]>=2.1.8",
  "alembic>=1.20.1",
  "aiosmtplib>=5.1.3",
  "uuid-utils>=1.2.0",
  "email-validator>=2.3.0",
  "boto3>=1.44.2",
  "python-multipart>=0.0.33",
  "celery>=5.7.0",
  "packaging>=24.0",  # imported by kombu's Redis transport; not declared by kombu itself
  "pypdfium2>=5.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.15.0",
    "hypothesis>=6.170.15",
    "pypdf>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "E501", "RUF001", "RUF003", "RUF005", "RUF007", "F811", "S608", "ASYNC109"]
"migrations/*" = ["E501", "I001", "S608"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = []
files = ["app", "tests", "evals"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "asyncpg", "asyncpg.*", "boto3", "boto3.*", "botocore", "botocore.*", "pypdfium2", "pypdfium2.*", "celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.tasks"]
disallow_untyped_decorators = false  # celery ships no type information
