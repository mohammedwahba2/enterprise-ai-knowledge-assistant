<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction B — Instrument</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F11;--panel:#141518;--panel2:#1A1C20;--line:#25272C;--line2:#30333A;--tx:#ECECEE;--tx2:#A0A2AA;--tx3:#6C6E76;--amber:#E8A33D;--amber-d:rgba(232,163,61,.14);--ok:#6FBF9B;--err:#E5755F;
--ui:"Inter Tight","IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 13.5px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Inter Tight",sans-serif}
.app{display:grid;grid-template-columns:52px 1fr;min-height:100vh}
.rail{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;background:var(--bg)}
.rail .lg{width:28px;height:28px;border-radius:7px;background:var(--amber);color:#1a1205;display:grid;place-items:center;font:600 12px var(--mono);margin-bottom:10px}
.rail a{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--tx3)}
.rail a[aria-current]{background:var(--panel2);color:var(--tx)}
.rail a i{width:14px;height:14px;border:1.5px solid currentColor;border-radius:4px}
.rail .sp{flex:1}
header{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;color:var(--tx2);font-size:12.5px}
header b{color:var(--tx);font-weight:500}
header .tools{margin-inline-start:auto;display:flex;gap:8px;font:400 11.5px var(--mono);color:var(--tx3)}
.k{border:1px solid var(--line2);border-radius:4px;padding:0 5px;font:400 11px var(--mono);color:var(--tx2);background:var(--panel)}
/* HOME */
.home{max-width:1040px;margin:0 auto;padding:44px 24px 120px}
.bar{background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.bar input{all:unset;display:block;width:100%;padding:16px 18px;font:400 17px var(--ui);color:var(--tx)}
.bar input::placeholder{color:var(--tx3)}
.bar .sug{border-top:1px solid var(--line);padding:6px}
.sug div{display:flex;gap:10px;align-items:center;padding:7px 12px;border-radius:6px;color:var(--tx2)}
.sug div.on{background:var(--panel2);color:var(--tx)}
.sug .k{margin-inline-start:auto}
.sug .tag{font:400 11px var(--mono);color:var(--tx3);width:64px}
.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;margin-top:36px}
.hd{display:flex;align-items:center;padding:0 0 8px;font:500 11.5px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] .hd{letter-spacing:0;font-family:var(--ui)}
.hd span:last-child{margin-inline-start:auto}
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--mono);color:var(--tx3);text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
[dir=rtl] th{letter-spacing:0;font-family:var(--ui)}
td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--tx2)}
td:first-child{color:var(--tx);font-weight:500}
tr:hover td{background:var(--panel)}
.m{font:400 12px var(--mono)}
.s{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.s:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.s.w:before{background:var(--amber);box-shadow:0 0 0 3px var(--amber-d)}.s.e:before{background:var(--err)}
.feed div{padding:9px 0;border-bottom:1px solid var(--line);color:var(--tx2);font-size:12.5px;display:flex;gap:10px}
.feed .m{color:var(--tx3);min-width:44px}
.feed b{color:var(--tx);font-weight:500}
/* CHAT */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 45px)}
.th{overflow:auto;padding:28px 40px 120px}
.col{max-width:700px;margin:0 auto}
.u{display:flex;gap:10px;margin-bottom:22px}
.u .m{color:var(--tx3);padding-top:2px;min-width:30px}
.u span.t{font-weight:500;font-size:15px}
.a{padding-inline-start:40px;position:relative}
.a:before{content:"";position:absolute;inset-inline-start:12px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.a p{font-size:15px;line-height:1.7;color:#DCDCE0;margin-bottom:12px}
[dir=rtl] .a p{line-height:2}
.cite{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--mono);color:var(--amber);background:var(--amber-d);border-radius:5px;padding:1px 7px;margin-inline:3px;vertical-align:baseline;white-space:nowrap}
[dir=rtl] .cite{font-family:var(--ui)}
.meta{display:flex;gap:14px;font:400 11.5px var(--mono);color:var(--tx3);margin:6px 0 18px}
[dir=rtl] .meta{font-family:var(--ui)}
.srcs{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.srcs div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.srcs div:last-child{border:0}
.srcs div.on{background:var(--panel)}
.srcs .n{font:500 11px var(--mono);color:var(--amber)}
.srcs b{font-weight:500}.srcs small{display:block;color:var(--tx3);font-size:12px}
.comp{position:absolute;bottom:20px;inset-inline:0;display:flex;justify-content:center;pointer-events:none}
.comp div{pointer-events:auto;width:min(680px,calc(100% - 80px));background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;color:var(--tx3);display:flex;align-items:center}
.comp .k{margin-inline-start:auto}
.pane{border-inline-start:1px solid var(--line);background:var(--panel);overflow:auto}
.pt{display:flex;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;align-items:center}
.pt b{font-weight:500}.pt .m{margin-inline-start:auto;color:var(--tx3)}
.doc{margin:16px;background:#F1EFEA;color:#2a2a2a;padding:26px 24px;border-radius:3px;font:400 11px/1.6 Georgia,serif;min-height:480px}
.doc h4{font:600 12px var(--ui);margin-bottom:8px}
.doc p{margin-bottom:9px}
.doc mark{background:#F4D58B;color:inherit}
.doc .g{height:6px;background:#DDD9D0;border-radius:3px;margin:7px 0}
.rel{padding:0 16px 16px;color:var(--tx3);font-size:12px}
</style></head>
<body>
<div class="app">
  <aside class="rail"><div class="lg">HG</div><a href="#" aria-current="page"><i></i></a><a href="#"><i></i></a><a href="#"><i></i></a><div class="sp"></div><a href="#"><i></i></a></aside>
  <main>
    <header><b data-en="Ask" data-ar="اسأل">Ask</b><span>/</span><span>Halden Group</span><div class="tools"><span class="k">⌘K</span><span data-en="llama · local" data-ar="نموذج محلي">local</span></div></header>

    <section class="home" data-screen="home">
      <div class="bar"><input data-ph-en="Ask anything about your documents, or jump to…" data-ph-ar="اسأل أي شيء عن مستنداتك، أو انتقل إلى…" placeholder="Ask…">
        <div class="sug">
          <div class="on"><span class="tag" data-en="Ask" data-ar="اسأل">Ask</span><span data-en="How many days of annual leave do new employees get?" data-ar="كم يوماً من الإجازة السنوية يحصل عليها الموظفون الجدد؟">x</span><span class="k">↵</span></div>
          <div><span class="tag" data-en="Document" data-ar="مستند">Doc</span><span data-en="Employee Handbook 2025" data-ar="دليل الموظف ٢٠٢٥">x</span><span class="k">⌘O</span></div>
          <div><span class="tag" data-en="Upload" data-ar="رفع">Upload</span><span data-en="Add documents to a collection" data-ar="أضف مستندات إلى مجموعة">x</span><span class="k">⌘U</span></div>
        </div></div>
      <div class="grid">
        <div><div class="hd"><span data-en="Knowledge base" data-ar="قاعدة المعرفة">Knowledge base</span><span class="m">4 / 126</span></div>
          <table><tr><th data-en="Document" data-ar="المستند">Document</th><th data-en="Collection" data-ar="المجموعة">Collection</th><th data-en="Pages" data-ar="الصفحات">Pages</th><th data-en="Status" data-ar="الحالة">Status</th></tr>
          <tr><td data-en="Employee Handbook 2025" data-ar="دليل الموظف ٢٠٢٥">x</td><td data-en="HR" data-ar="الموارد البشرية">x</td><td class="m">84</td><td><span class="s" data-en="Ready" data-ar="جاهز">x</span></td></tr>
          <tr><td data-en="Travel &amp; Expense Policy" data-ar="سياسة السفر والمصروفات">x</td><td data-en="Finance" data-ar="المالية">x</td><td class="m">22</td><td><span class="s" data-en="Ready" data-ar="جاهز">x</span></td></tr>
          <tr><td data-en="Information Security Standard" data-ar="معيار أمن المعلومات">x</td><td data-en="IT" data-ar="تقنية المعلومات">x</td><td class="m">47</td><td><span class="s w" data-en="Indexing 61%" data-ar="فهرسة ٦١٪">x</span></td></tr>
          <tr><td>Supplier_Agreement_scan.pdf</td><td data-en="Legal" data-ar="الشؤون القانونية">x</td><td class="m">12</td><td><span class="s e" data-en="No text layer" data-ar="بلا طبقة نصية">x</span></td></tr></table></div>
        <div><div class="hd"><span data-en="Activity" data-ar="النشاط">Activity</span></div><div class="feed">
          <div><span class="m">09:42</span><span><b data-en="Information Security Standard" data-ar="معيار أمن المعلومات">x</b> <span data-en="embedding, 29 of 47 pages" data-ar="جارٍ التضمين، ٢٩ من ٤٧ صفحة">x</span></span></div>
          <div><span class="m">09:31</span><span><b>Supplier_Agreement_scan.pdf</b> <span data-en="excluded: scanned, OCR off" data-ar="مستبعد: ممسوح ضوئياً، التعرف الضوئي معطّل">x</span></span></div>
          <div><span class="m">08:55</span><span><b data-en="Travel &amp; Expense Policy" data-ar="سياسة السفر والمصروفات">x</b> <span data-en="ready, 61 passages" data-ar="جاهز، ٦١ مقطعاً">x</span></span></div></div></div>
      </div>
    </section>

    <section class="chat" data-screen="chat" hidden>
      <div style="position:relative;min-width:0"><div class="th"><div class="col">
        <div class="u"><span class="m">You</span><span class="t" data-en="How many days of annual leave do new employees get, and can unused days be carried over?" data-ar="كم يوماً من الإجازة السنوية يحصل عليها الموظفون الجدد، وهل يمكن ترحيل الأيام غير المستخدمة؟">q</span></div>
        <div class="a">
          <p><span data-en="New employees get 25 working days of paid leave per calendar year, pro-rated from their start date." data-ar="يحصل الموظفون الجدد على ٢٥ يوم عمل إجازة مدفوعة في السنة الميلادية، وتُحتسب بالتناسب من تاريخ المباشرة.">x</span><span class="cite"><span data-en="Handbook · p.14" data-ar="الدليل · ص ١٤">x</span></span></p>
          <p><span data-en="Up to 5 unused days can be carried over; they are forfeited after 31 March." data-ar="يمكن ترحيل ما يصل إلى ٥ أيام غير مستخدمة، وتسقط بعد ٣١ مارس.">x</span><span class="cite"><span data-en="Handbook · p.15" data-ar="الدليل · ص ١٥">x</span></span></p>
          <div class="meta"><span data-en="✓ Supported · 2 passages" data-ar="✓ مدعومة · مقطعان">x</span><span data-en="4.1 s · 6 retrieved" data-ar="٤٫١ ث · ٦ مسترجعة">x</span></div>
          <div class="srcs">
            <div><span class="n">1</span><span><b data-en="Employee Handbook 2025" data-ar="دليل الموظف ٢٠٢٥">x</b><small data-en="§4.2 Annual leave" data-ar="٤٫٢ الإجازة السنوية">x</small></span><span class="m" data-en="p. 14" data-ar="ص ١٤">x</span></div>
            <div class="on"><span class="n">2</span><span><b data-en="Employee Handbook 2025" data-ar="دليل الموظف ٢٠٢٥">x</b><small data-en="§4.4 Carry-over" data-ar="٤٫٤ الترحيل">x</small></span><span class="m" data-en="p. 15" data-ar="ص ١٥">x</span></div>
          </div></div>
      </div></div><div class="comp"><div><span data-en="Follow up…" data-ar="سؤال متابع…">Follow up</span><span class="k">↵</span></div></div></div>
      <aside class="pane"><div class="pt"><b data-en="Employee Handbook 2025" data-ar="دليل الموظف ٢٠٢٥">x</b><span class="m" data-en="p. 15 / 84" data-ar="ص ١٥ / ٨٤">x</span></div>
        <div class="doc"><h4 data-en="4.4 Carry-over" data-ar="٤٫٤ الترحيل">x</h4><p data-en="Annual leave should be taken within the calendar year in which it accrues." data-ar="ينبغي استخدام الإجازة السنوية خلال السنة الميلادية التي تُستحق فيها.">x</p><p><mark data-en="Employees may carry over a maximum of five (5) unused days. Carried-over days are forfeited after 31 March." data-ar="يجوز للموظف ترحيل ما لا يزيد على خمسة (٥) أيام غير مستخدمة. وتسقط الأيام المرحّلة بعد ٣١ مارس.">x</mark></p><div class="g"></div><div class="g" style="width:78%"></div><div class="g" style="width:90%"></div></div>
        <div class="rel" data-en="Also considered: Travel &amp; Expense Policy p.3 (score 0.31, below threshold)" data-ar="روعي أيضاً: سياسة السفر ص ٣ (الدرجة ٠٫٣١، أقل من الحد)">x</div></aside>
    </section>
  </main>
</div>

</body></html>
