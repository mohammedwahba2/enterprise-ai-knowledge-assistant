name: knowledge-assistant

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    <<: *hardening
    build: ./frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: { context: ./backend, target: runtime }
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      # Owner credentials: only the migration uses them (it creates tables, policies and the app role).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run ./scripts/init-env.sh}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?run ./scripts/init-env.sh}
    depends_on:
      postgres: { condition: service_healthy }

  mailpit:
    <<: *hardening
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"] # web UI, localhost only
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *hardening
    build: { context: ./backend, target: runtime }
    environment:
      APP_ORIGIN: http://localhost:${HTTP_PORT:-8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:?run ./scripts/init-env.sh}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      # The API connects as the restricted role `app_rw` (NOT the owner), so RLS always applies.
      DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD:?run ./scripts/init-env.sh}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run ./scripts/init-env.sh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run ./scripts/init-env.sh}
      S3_BUCKET: ${S3_BUCKET:-knowledge-documents}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background processing: parses documents (untrusted input, native code, LibreOffice) away from the
  # API, as the restricted `worker_rw` database role.
  worker:
    <<: *hardening
    build: { context: ./backend, target: worker }
    image: knowledge-assistant-worker
    environment: &worker-env
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      WORKER_DATABASE_URL: postgresql://worker_rw:${WORKER_DB_PASSWORD:?run ./scripts/init-env.sh}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run ./scripts/init-env.sh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run ./scripts/init-env.sh}
      S3_BUCKET: ${S3_BUCKET:-knowledge-documents}
      JWT_SECRET: ${JWT_SECRET:?run ./scripts/init-env.sh}
      # Embeddings come from Ollama running natively on the host (PLAN section 7): the container
      # reaches it through host.docker.internal. Ollama listens on loopback only; Docker Desktop
      # forwards host.docker.internal to it.
      EMBEDDER_URL: ${EMBEDDER_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs: ["/tmp:size=1g,mode=1777"]
    mem_limit: 3g
    pids_limit: 512
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Periodic housekeeping (stuck documents, purged objects, orphan workspace files).
  # Runs the SAME image as the worker (never a separately built copy that can silently go stale:
  # that is how a crash-looping scheduler once went unnoticed).
  beat:
    <<: *hardening
    image: knowledge-assistant-worker
    pull_policy: never
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *worker-env
    tmpfs: ["/tmp:size=16m,mode=1777"]
    depends_on:
      worker: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # beat rewrites its schedule file every time it sends a task (at least once a minute)
      test: ["CMD-SHELL", "find /tmp -name 'celerybeat-schedule*' -mmin -3 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run ./scripts/init-env.sh}
      POSTGRES_USER: ${POSTGRES_USER:?run ./scripts/init-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./scripts/init-env.sh}
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  objectstore:
    <<: *hardening
    # S3-compatible object store (SeaweedFS replaced MinIO; see docs/PLAN.md D12).
    # Single node, S3 gateway on :8333, credentials from the environment.
    image: chrislusf/seaweedfs:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run ./scripts/init-env.sh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run ./scripts/init-env.sh}
    volumes: ["objectdata:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  objectdata:
